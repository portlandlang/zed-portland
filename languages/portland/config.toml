name = "Portland"
grammar = "ruby"
path_suffixes = ["pdx"]
line_comments = ["# "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
    { start = "'", end = "'", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
]
collapsed_placeholder = "# ..."
tab_size = 2
increase_indent_pattern = '(^\s*(case|class|def|else|elsif|enum|if|in|module|struct|together|trait|unless|until|when|while)\b|\bdo\s*(\|[^|]*\|)?\s*$)'
decrease_indent_pattern = '^\s*(else|elsif|end|in|when)\b'
word_characters = ["?", "!"]
